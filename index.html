<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snehangsu | Portfolio</title>
  <!-- Google Fonts: Outfit (modern, clean, geometric sans-serif similar to Google Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Link CSS -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome for icons (e.g., GitHub, Email, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Slideshow -->
  <div class="bg-container">
    <div class="bg-image active" style="background-image: url('assets/image1.jpg');"></div>
    <div class="bg-image" style="background-image: url('assets/image2.jpg');"></div>
    <div class="bg-image" style="background-image: url('assets/image3.jpg');"></div>
  </div>

  <!-- Google Aesthetics Accent Bar -->
  <div class="google-bar">
    <div class="bar-segment blue"></div>
    <div class="bar-segment red"></div>
    <div class="bar-segment yellow"></div>
    <div class="bar-segment green"></div>
  </div>

  <!-- Main Content Wrapper -->
  <main class="main-content">
    <div class="hero-card">
      <div class="profile-avatar">
        <i class="fa-regular fa-user"></i>
      </div>
      <h1 class="heading">Meet Snehangsu</h1>
      <p class="subtitle">Developer &amp; Creator</p>
      
      <p class="description">
        Welcome to my personal space. I build clean, modern web experiences with high attention to detail. Currently crafting code, designing UI/UX, and turning ideas into functional software.
      </p>

      <!-- Social Links -->
      <div class="social-links">
        <a href="https://github.com" target="_blank" aria-label="GitHub" class="social-btn github">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="mailto:your-email@example.com" aria-label="Email" class="social-btn email">
          <i class="fa-regular fa-envelope"></i>
        </a>
        <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn" class="social-btn linkedin">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
      </div>

      <!-- Footer-like indicator inside card -->
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Available for new projects</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
